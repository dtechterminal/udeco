# SPDX-License-Identifier: GPL-2.0-or-later
#
# Tests the repository, then builds the on-device agent once per supported
# device. Each device builds through its own deploy script's --build-only,
# so the binary here is the one a deploy of the same commit ships (same Go
# toolchain from go.mod and the same tags: -trimpath, empty build id and
# gzip -n make the build reproducible). Download them from the run's Artifacts.
#
# A tag vX.Y.Z also publishes a GitHub release: every device's build,
# renamed udeco-ap-<device>-<arch>, with SHA256SUMS and CHANGELOG.md's
# section for the tag as its notes (.github/release-notes.sh; no section,
# no release).
#
# A new device gets its own deploy script (deploy/<device>-ap.sh with
# --build-only) and its own entry in the matrix below;
# TestCIBuildsEveryDevice (cmd/udeco-ap) fails until both exist.
name: build

on:
  push:
    # main always gets the same commit as deco, so building it too would
    # only repeat this run
    branches: [deco]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: deco-x20
            script: deploy/deco-ap.sh
            out: dist/udeco-ap-linux-armv7
          - device: jio-jcow414
            script: deploy/jio-ap.sh
            out: dist/udeco-ap-linux-mipsle
    name: build (${{ matrix.device }})
    steps:
      # full history and tags: Go stamps the module's version, from the
      # nearest tag, into the binary, and a shallow clone has no tags
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          SCRIPT: ${{ matrix.script }}
        run: bash "$SCRIPT" --build-only
      - name: checksums
        env:
          OUT: ${{ matrix.out }}
        run: |
          cd "$(dirname "$OUT")"
          files=$(ls "$(basename "$OUT")" "$(basename "$OUT").gz" 2>/dev/null)
          sha256sum $files > SHA256SUMS
          md5sum $files > MD5SUMS
          cat SHA256SUMS MD5SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: udeco-ap-${{ matrix.device }}
          path: |
            ${{ matrix.out }}
            ${{ matrix.out }}.gz
            dist/SHA256SUMS
            dist/MD5SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: notes
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: udeco-ap-*
      # artifacts/udeco-ap-<device>/udeco-ap-linux-<arch>[.gz] becomes
      # release/udeco-ap-<device>-linux-<arch>[.gz]: one name per device, the
      # bytes unchanged
      - name: assets
        run: |
          mkdir release
          for dir in artifacts/udeco-ap-*/; do
            device=$(basename "$dir"); device=${device#udeco-ap-}
            for f in "$dir"udeco-ap-linux-*; do
              cp "$f" "release/udeco-ap-$device-${f##*/udeco-ap-}"
            done
          done
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "udeco $TAG" --notes-file "$RUNNER_TEMP/notes.md"
