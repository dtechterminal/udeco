plugin_start() {
	ebtables -t broute -A BROUTING -i wifi0ap0 -p 802_1Q -j DROP
	ebtables -t broute -A BROUTING --vlan-id 2 -p 802_1Q -j DROP
	mkdir -p /var/lib/ebtables
	true
}
plugin_stop() {
	ebtables -t broute -F; ebtables -t broute -X; ebtables -t broute -Z
	ebtables -t nat -F; ebtables -t nat -X; ebtables -t nat -Z;
	ebtables -F; ebtables -X; ebtables -Z;
	rm -rf /var/lib/ebtables
	true
}
