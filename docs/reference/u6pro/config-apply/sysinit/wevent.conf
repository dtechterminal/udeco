plugin_start() {
	echo 'null::respawn:/sbin/wevent' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	echo 'null::watch:/sbin/stahtd' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/sbin/wevent`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	sed -i '\`/sbin/stahtd`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	kill `pidof wevent`
	true
}
