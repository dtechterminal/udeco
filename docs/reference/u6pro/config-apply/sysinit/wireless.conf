plugin_start() {
	rm -f /var/run/vapusage.*
	rm -f /var/run/vapid.*
	mkdir -p /var/run/schedules/
	rm -f /var/run/schedule_wlan_stop_work.*
	touch /var/run/wlan_configured_devnames
	touch /var/run/guest_devnames
	echo 1 > /proc/ui_multicast/mc_inspect/mdns_enabled
	echo false > /proc/ui_neighbor/same_chan_include
	rm -f /var/run/if_up_hook.wifi0ap0
	rm -f /var/run/vapusage.wifi0ap0
	rm -f /var/run/vapid.wifi0ap0
	rm -f /var/run/schedules/schedule.wifi0ap0
	rm -f /var/run/schedules/schedule_invert.wifi0ap0
	rm -f /var/run/schedules/schedule_wlan_stop_work.wifi0ap0
	rm -f /var/run/vwire.*.wifi0ap0
	rm -f /var/run/*.ssids
	_batch_file="/tmp/cfg_batch.wifi0ap0"
	> "$_batch_file"
	cfg80211tool() { echo "$@" >> "$_batch_file"; }
	cfg80211tool "wifi0ap0" dbgLVL 0
	cfg80211tool "wifi0ap0" dbgLVL_high 0x40000000
	cfg80211tool "wifi0ap0" no_wradar 0
	cfg80211tool "wifi0ap0" idhcp 1
	cfg80211tool "wifi0ap0" authmode 1
	cfg80211tool "wifi0ap0" htweptkip 0
	cfg80211tool "wifi0ap0" mcastenhance 0
	cfg80211tool "wifi0ap0" countryie 1
	cfg80211tool "wifi0ap0" no2ghz_oui "0,0,0,3,2,16,30"
	cfg80211tool "wifi0ap0" setfilter 0
	cfg80211tool "wifi0ap0" vhtmubfer 1
	cfg80211tool "wifi0ap0" vhtsubfer 1
	cfg80211tool "wifi0ap0" implicitbf 0
	cfg80211tool "wifi0ap0" dyn_bw_rts 1
	cfg80211tool "wifi0ap0" cwmenable 0
	cfg80211tool "wifi0ap0" disablecoext 1
	cfg80211tool "wifi0ap0" vht_11ng 0
	cfg80211tool "wifi0ap0" hide_ssid "0"
	cfg80211tool "wifi0ap0" qbssload "0"
	cfg80211tool "wifi0ap0" dgaf_disable "0"
	cfg80211tool "wifi0ap0" ap_bridge "0"
	cfg80211tool "wifi0ap0" isolation "1"
	cfg80211tool "wifi0ap0" dtim_period 1
	cfg80211tool "wifi0ap0" uapsd 1
	cfg80211tool "wifi0ap0" puren 0
	cfg80211tool "wifi0ap0" pureg 0
	cfg80211tool "wifi0ap0" ubnt_df_mode 0
	cfg80211tool "wifi0ap0" shortgi 1
	cfg80211tool "wifi0ap0" acparams 1 0 1 0
	cfg80211tool "wifi0ap0" maccmd_sec 2
	cfg80211tool "wifi0ap0" bcfiltflush
	cfg80211tool "wifi0ap0" bcfiltenable 0
	cfg80211tool "wifi0ap0" ap_bridge_mode 0
	cfg80211tool "wifi0ap0" bcfiltbypass 3
	cfg80211tool "wifi0ap0" bcfiltnssexc 0
	echo wifi0ap0 0 > /proc/ui_multicast/mc_suppressor/enable
	cfg80211tool "wifi0ap0" isolation_flush
	cfg80211tool "wifi0ap0" advisolationen 0
	cfg80211tool "wifi0ap0" mc_inspect 1
	echo '-wifi0ap0' > /proc/ui_dns_cache/interfaces 2>/dev/null || true
	echo '-wifi0ap0' > /proc/ui_dns_bypass/interfaces 2>/dev/null || true
	cfg80211tool "wifi0ap0" twt_responder 3
	cfg80211tool "wifi0ap0" rrm 1
	cfg80211tool "wifi0ap0" wds 0
	cfg80211tool "wifi0ap0" guest_vap 0
	cfg80211tool "wifi0ap0" randomized_gtk 0
	sed -i "/^wifi0ap0$/d" "/var/run/guest_devnames"
	echo "user" > /var/run/vapusage.wifi0ap0
	echo "3" > /var/run/vapid.wifi0ap0
	grep -Fxq "EXN IOT" /var/run/wifi0.ssids || echo "EXN IOT" >> "/var/run/wifi0.ssids"
	iwconfig "wifi0ap0" essid "EXN IOT"
	echo '0=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '1=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '2=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '3=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '4=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '5=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	echo '6=00:00-23:59' >> /var/run/schedules/schedule.wifi0ap0
	cfg80211tool "wifi0ap0" minrate_data 1000
	cfg80211tool "wifi0ap0" bcast_rate 1000
	cfg80211tool "wifi0ap0" mcast_rate 1000
	cfg80211tool "wifi0ap0" mgmt_rate 1000
	cfg80211tool "wifi0ap0" set_bcn_rate 1000
	cfg80211tool "wifi0ap0" minrate_nobelow 1
	cfg80211tool "wifi0ap0" btm_dis_thld -80
	cfg80211tool "wifi0ap0" btm_disassoc 0
	cfg80211tool "wifi0ap0" shortslot 0
	cfg80211tool "wifi0ap0" enablertscts 0x21
	cfg80211tool "wifi0ap0" en_6g_sec_comp 0
	cfg80211tool "wifi0ap0" backhaul 0
	cfg80211tool "wifi0ap0" stafwd 0
	cfg80211tool "wifi0ap0" mscs 0
	cfg80211tool "wifi0ap0" scs 0
	cfg80211tool "wifi0ap0" dscp_action_policy 0
	cfg80211tool "wifi0ap0" set_vdev_peer_prot_count 1
	echo "cfg80211tool wifi0ap0 vap_contryie 1
" >> /var/run/if_up_hook.wifi0ap0
	unset -f cfg80211tool
	if [ -s "$_batch_file" ]; then cfg80211tool_batch < "$_batch_file"; fi
	rm -f "$_batch_file"
	sed -i '\`wlanconfig wifi0ap0 vendorie .* oui 00156d`d' /var/run/if_up_hook.wifi0ap0
	echo "wlanconfig wifi0ap0 vendorie remove len 4 oui 00156d pcap_data 01
" >> /var/run/if_up_hook.wifi0ap0
	wifitool "wifi0ap0" setUnitTestCmd 10 3 6 2 3
	wifitool "wifi0ap0" setUnitTestCmd 0x47 2 32 0
	rm -f /var/run/if_up_hook.wifi1ap1
	rm -f /var/run/vapusage.wifi1ap1
	rm -f /var/run/vapid.wifi1ap1
	rm -f /var/run/schedules/schedule.wifi1ap1
	rm -f /var/run/schedules/schedule_invert.wifi1ap1
	rm -f /var/run/schedules/schedule_wlan_stop_work.wifi1ap1
	rm -f /var/run/vwire.*.wifi1ap1
	_batch_file="/tmp/cfg_batch.wifi1ap1"
	> "$_batch_file"
	cfg80211tool() { echo "$@" >> "$_batch_file"; }
	cfg80211tool "wifi1ap1" dbgLVL 0
	cfg80211tool "wifi1ap1" dbgLVL_high 0x40000000
	cfg80211tool "wifi1ap1" no_wradar 0
	cfg80211tool "wifi1ap1" idhcp 1
	cfg80211tool "wifi1ap1" authmode 1
	cfg80211tool "wifi1ap1" htweptkip 0
	cfg80211tool "wifi1ap1" mcastenhance 5
	cfg80211tool "wifi1ap1" countryie 1
	cfg80211tool "wifi1ap1" setfilter 0
	cfg80211tool "wifi1ap1" vhtmubfer 1
	cfg80211tool "wifi1ap1" vhtsubfer 1
	cfg80211tool "wifi1ap1" implicitbf 0
	cfg80211tool "wifi1ap1" dyn_bw_rts 1
	cfg80211tool "wifi1ap1" vht_11ng 0
	cfg80211tool "wifi1ap1" hide_ssid "0"
	cfg80211tool "wifi1ap1" qbssload "1"
	cfg80211tool "wifi1ap1" dgaf_disable "0"
	cfg80211tool "wifi1ap1" ap_bridge "1"
	cfg80211tool "wifi1ap1" isolation "0"
	cfg80211tool "wifi1ap1" dtim_period 3
	cfg80211tool "wifi1ap1" uapsd 1
	cfg80211tool "wifi1ap1" puren 0
	cfg80211tool "wifi1ap1" pureg 1
	cfg80211tool "wifi1ap1" ubnt_df_mode 0
	cfg80211tool "wifi1ap1" shortgi 1
	cfg80211tool "wifi1ap1" acparams 1 0 1 0
	cfg80211tool "wifi1ap1" maccmd_sec 2
	cfg80211tool "wifi1ap1" bcfiltflush
	cfg80211tool "wifi1ap1" bcfiltenable 0
	cfg80211tool "wifi1ap1" ap_bridge_mode 0
	cfg80211tool "wifi1ap1" bcfiltbypass 3
	cfg80211tool "wifi1ap1" bcfiltnssexc 0
	echo wifi1ap1 0 > /proc/ui_multicast/mc_suppressor/enable
	cfg80211tool "wifi1ap1" isolation_flush
	cfg80211tool "wifi1ap1" advisolationen 0
	cfg80211tool "wifi1ap1" mc_inspect 1
	echo '-wifi1ap1' > /proc/ui_dns_cache/interfaces 2>/dev/null || true
	echo '-wifi1ap1' > /proc/ui_dns_bypass/interfaces 2>/dev/null || true
	cfg80211tool "wifi1ap1" twt_responder 3
	cfg80211tool "wifi1ap1" rrm 1
	cfg80211tool "wifi1ap1" wds 0
	cfg80211tool "wifi1ap1" guest_vap 0
	cfg80211tool "wifi1ap1" randomized_gtk 0
	sed -i "/^wifi1ap1$/d" "/var/run/guest_devnames"
	echo "user" > /var/run/vapusage.wifi1ap1
	echo "1" > /var/run/vapid.wifi1ap1
	grep -Fxq "Example Network" /var/run/wifi1.ssids || echo "Example Network" >> "/var/run/wifi1.ssids"
	iwconfig "wifi1ap1" essid "Example Network"
	echo '0=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '1=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '2=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '3=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '4=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '5=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	echo '6=00:00-23:59' >> /var/run/schedules/schedule.wifi1ap1
	cfg80211tool "wifi1ap1" bcast_rate 6000
	cfg80211tool "wifi1ap1" mcast_rate 6000
	cfg80211tool "wifi1ap1" mgmt_rate 6000
	cfg80211tool "wifi1ap1" set_bcn_rate 6000
	cfg80211tool "wifi1ap1" minrate_nobelow 0
	cfg80211tool "wifi1ap1" btm_dis_thld -80
	cfg80211tool "wifi1ap1" btm_disassoc 0
	cfg80211tool "wifi1ap1" cwmenable 1
	cfg80211tool "wifi1ap1" shortslot 0
	cfg80211tool "wifi1ap1" enablertscts 0x21
	cfg80211tool "wifi1ap1" en_6g_sec_comp 0
	cfg80211tool "wifi1ap1" backhaul 0
	cfg80211tool "wifi1ap1" stafwd 0
	cfg80211tool "wifi1ap1" mscs 0
	cfg80211tool "wifi1ap1" scs 0
	cfg80211tool "wifi1ap1" dscp_action_policy 0
	cfg80211tool "wifi1ap1" set_vdev_peer_prot_count 1
	echo "cfg80211tool wifi1ap1 vap_contryie 1
" >> /var/run/if_up_hook.wifi1ap1
	unset -f cfg80211tool
	if [ -s "$_batch_file" ]; then cfg80211tool_batch < "$_batch_file"; fi
	rm -f "$_batch_file"
	sed -i '\`wlanconfig wifi1ap1 vendorie .* oui 00156d`d' /var/run/if_up_hook.wifi1ap1
	echo "wlanconfig wifi1ap1 vendorie remove len 4 oui 00156d pcap_data 01
" >> /var/run/if_up_hook.wifi1ap1
	wifitool "wifi1ap1" setUnitTestCmd 10 6 35 25 8 75 100 400
	wifitool "wifi1ap1" setUnitTestCmd 0x47 2 32 0
	cfg80211tool "wifi0ap0" protmode 1
	syswrapper.sh 11k-stop
	cfg80211tool "wifi0ap0" no2ghz_oui "0,0,0,3,2,16,30"
	cfg80211tool "wifi0ap0" no2ghz_oui "0,0,0,3,2,16,30"
	true
}
plugin_stop() {
	killall wpa_supplicant
	ifconfig "wifi0ap0" down
	iwconfig "wifi0ap0" key off
	_batch_file="/tmp/cfg_batch.wifi0ap0"
	> "$_batch_file"
	cfg80211tool() { echo "$@" >> "$_batch_file"; }
	cfg80211tool "wifi0ap0" wds 0
	cfg80211tool "wifi0ap0" maccmd_sec 3
	cfg80211tool "wifi0ap0" maccmd_sec 0
	cfg80211tool "wifi0ap0" bcfiltflush
	cfg80211tool "wifi0ap0" bcfiltenable 0
	cfg80211tool "wifi0ap0" ap_bridge_mode 0
	cfg80211tool "wifi0ap0" bcfiltbypass 3
	cfg80211tool "wifi0ap0" bcfiltnssexc 0
	echo wifi0ap0 0 > /proc/ui_multicast/mc_suppressor/enable
	cfg80211tool "wifi0ap0" isolation_flush
	cfg80211tool "wifi0ap0" advisolationen 0
	echo '-wifi0ap0' > /proc/ui_dns_cache/interfaces 2>/dev/null || true
	echo '-wifi0ap0' > /proc/ui_dns_bypass/interfaces 2>/dev/null || true
	unset -f cfg80211tool
	if [ -s "$_batch_file" ]; then cfg80211tool_batch < "$_batch_file"; fi
	rm -f "$_batch_file"
	rm -f /var/run/if_up_hook.wifi0ap0
	rm -f /var/run/vapusage.wifi0ap0
	rm -f /var/run/vapid.wifi0ap0
	rm -f /var/run/schedules/schedule.wifi0ap0
	rm -f /var/run/schedules/schedule_invert.wifi0ap0
	rm -f /var/run/schedules/schedule_wlan_stop_work.wifi0ap0
	rm -f /var/run/vwire.*.wifi0ap0
	ifconfig "wifi1ap1" down
	iwconfig "wifi1ap1" key off
	_batch_file="/tmp/cfg_batch.wifi1ap1"
	> "$_batch_file"
	cfg80211tool() { echo "$@" >> "$_batch_file"; }
	cfg80211tool "wifi1ap1" wds 0
	cfg80211tool "wifi1ap1" maccmd_sec 3
	cfg80211tool "wifi1ap1" maccmd_sec 0
	cfg80211tool "wifi1ap1" bcfiltflush
	cfg80211tool "wifi1ap1" bcfiltenable 0
	cfg80211tool "wifi1ap1" ap_bridge_mode 0
	cfg80211tool "wifi1ap1" bcfiltbypass 3
	cfg80211tool "wifi1ap1" bcfiltnssexc 0
	echo wifi1ap1 0 > /proc/ui_multicast/mc_suppressor/enable
	cfg80211tool "wifi1ap1" isolation_flush
	cfg80211tool "wifi1ap1" advisolationen 0
	echo '-wifi1ap1' > /proc/ui_dns_cache/interfaces 2>/dev/null || true
	echo '-wifi1ap1' > /proc/ui_dns_bypass/interfaces 2>/dev/null || true
	unset -f cfg80211tool
	if [ -s "$_batch_file" ]; then cfg80211tool_batch < "$_batch_file"; fi
	rm -f "$_batch_file"
	rm -f /var/run/if_up_hook.wifi1ap1
	rm -f /var/run/vapusage.wifi1ap1
	rm -f /var/run/vapid.wifi1ap1
	rm -f /var/run/schedules/schedule.wifi1ap1
	rm -f /var/run/schedules/schedule_invert.wifi1ap1
	rm -f /var/run/schedules/schedule_wlan_stop_work.wifi1ap1
	rm -f /var/run/vwire.*.wifi1ap1
	[ -e /var/run/scan_devname ] && ifconfig `cat /var/run/scan_devname` down
	rm -f /var/run/vapusage.*
	rm -f /var/run/vapid.*
	rm -rf /var/run/schedules
	rm -f /var/run/schedule_wlan_stop_work.*
	rm -f /var/run/if_up_hook.*
	rm -f /var/run/post_hostapd_up_hook.*
	rm -f /var/run/wlan_configured_devnames
	rm -f /var/run/guest_devnames
	syswrapper.sh 11k-stop
	cfg80211tool "wifi0ap0" no2ghz_oui "0,0,0,3,2,16,30"
	cfg80211tool "wifi0ap0" no2ghz_oui "0,0,0,3,2,16,30"
	true
}
