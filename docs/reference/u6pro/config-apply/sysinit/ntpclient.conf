plugin_start() {
	echo 'null::respawn:/usr/sbin/ntpd -nN -p 0.ubnt.pool.ntp.org -p 1.ubnt.pool.ntp.org -p 2.ubnt.pool.ntp.org -p 3.ubnt.pool.ntp.org' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/usr/sbin/ntpd`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	killall -9 ntpd
	true
}
