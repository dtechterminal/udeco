plugin_start() {
	echo false > /proc/ubnt_peek/ipv6_disable
	echo 1 > /proc/sys/net/ipv4/conf/all/arp_filter
	echo 2 > /proc/sys/net/ipv6/conf/default/accept_ra
	for i in /sys/class/net/*; do [ -d $i ] && echo 2 > /proc/sys/net/ipv6/conf/`basename $i`/accept_ra; done
	ifconfig "lo" 127.0.0.1 up
	ifconfig "br0" 0.0.0.0 up
	ifconfig "br0" allmulti
	ifconfig "eth0" 0.0.0.0 promisc up
	ifconfig "eth0" allmulti
	ifconfig "br0.2" 0.0.0.0 up
	ifconfig "br0.2" allmulti
	ifconfig "wifi1ap1" 0.0.0.0 promisc down
	ifconfig "wifi1ap1" allmulti
	ifconfig "wifi0ap0" 0.0.0.0 promisc down
	ifconfig "wifi0ap0" allmulti
	ifconfig "eth0.2" 0.0.0.0 up
	ifconfig "eth0.2" allmulti
	true
}
plugin_stop() {
	if [ "$IS_UBNTCONF_FAST_APPLY" = "true" ]; then
		mca-cli-op ws-reconnect
	fi
	ifconfig "br0" down
	ifconfig "eth0" down
	ifconfig "br0.2" down
	ifconfig "wifi1ap1" down
	ifconfig "wifi0ap0" down
	ifconfig "eth0.2" down
	echo 0 > /proc/sys/net/ipv4/ip_forward
	rm -f /var/run/ipready.*
	true
}
