plugin_start() {
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	echo 'null::respawn:/sbin/udhcpc -i br0 -f -S -p /var/run/udhcpc.br0.pid -t 10 -T 1 -A 2 -V ubnt -s /etc/udhcpc/udhcpc -x hostname:U6Pro' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	killall udhcpc
	else
	FAST_KILL_LIST="$FAST_KILL_LIST udhcpc"
	fi
	true
}
plugin_stop() {
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	DHCPC_KILL_PIDS=""
	sed -i '\`/sbin/udhcpc -i br0`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	rm -f /tmp/udhcpc-br0-conf
	DHCPC_KILL_PIDS="$DHCPC_KILL_PIDS $(cat /var/run/udhcpc.br0.pid)"
	kill $DHCPC_KILL_PIDS
	fi
	true
}
