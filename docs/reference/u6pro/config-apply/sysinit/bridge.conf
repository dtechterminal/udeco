plugin_start() {
	brctl addbr "br0"
	echo 2048 > /sys/class/net/"br0"/bridge/hash_max
	echo 0 > /sys/class/net/"br0"/bridge/multicast_snooping
	ifconfig "br0" hw ether 9c:05:d6:c2:df:08
	brctl setfd "br0" 1

	brctl stp "br0" off
	brctl setbridgeprio "br0" 65535
	echo 1 > /proc/sys/net/ipv4/conf/"br0"/arp_accept
	brctl addbr "br0.2"
	echo 1 > /proc/sys/net/ipv6/conf/"br0.2"/disable_ipv6
	echo 2048 > /sys/class/net/"br0.2"/bridge/hash_max
	echo 0 > /sys/class/net/"br0.2"/bridge/multicast_snooping
	ifconfig "br0.2" hw ether 9c:05:d6:c2:df:08
	brctl setfd "br0.2" 1

	brctl stp "br0.2" off
	brctl setbridgeprio "br0.2" 65535
	echo 1 > /proc/sys/net/ipv4/conf/"br0.2"/arp_accept
	ifconfig "eth0" add 0.0.0.0
	brctl addif "br0" "eth0"

	echo 1 > /sys/class/net/br0/brif/eth0/uplink
	echo 0 > /sys/class/net/br0/brif/eth0/uplink_priority

	ifconfig "wifi1ap1" add 0.0.0.0
	brctl addif "br0" "wifi1ap1"

	ifconfig "wifi0ap0" add 0.0.0.0
	brctl addif "br0.2" "wifi0ap0"

	ifconfig "eth0.2" add 0.0.0.0
	brctl addif "br0.2" "eth0.2"

	echo 1 > /sys/class/net/br0.2/brif/eth0.2/uplink
	echo 0 > /sys/class/net/br0.2/brif/eth0.2/uplink_priority

	echo add,mark=eth0,wifi1ap1,wifi0ap0,eth0.2, > /proc/nfbypass/netdevs
	true
}
plugin_stop() {
	ifconfig "br0" down
	syswrapper.sh del-bridge-vlans "br0"
	brctl delbr "br0"
	ifconfig "br0.2" down
	syswrapper.sh del-bridge-vlans "br0.2"
	rm -f /var/run/vapbridge.*
	echo del= > /proc/nfbypass/netdevs
	true
}
