plugin_start() {
	echo eth > /var/run/system.uplink
	echo 'null::watch:/usr/bin/uplink-monitor -p' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/usr/bin/wpa_supplicant_wrapper.sh`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	syswrapper.sh wpa-supplicant-cleanup
	sed -i '\`uplink-monitor`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	sed -i '\`ledring-ctrl`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	kill `pidof uplink-monitor` || true
	kill `pidof wpa_supplicant` || true
	kill `pidof ledring-ctrl` || true
	fi
	rm -f /var/run/system.uplink
	rm -f /var/run/system.uplink.prev
	rm -f /var/run/uplink_eth
	rm -f /var/run/uplink_wds
	rm -f /var/run/uplink_bridge
	rm -f /var/run/system.isolated_wlan_on
	rm -f /var/run/mesh.status
	FAST_KILL_LIST="$FAST_KILL_LIST uplink-monitor"
	FAST_KILL_LIST="$FAST_KILL_LIST wpa_supplicant"
	FAST_KILL_LIST="$FAST_KILL_LIST ledring-ctrl"
	true
}
