plugin_start() {
	echo 'null::respawn:/usr/bin/oom-protect -500 /usr/bin/mcad' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	echo 'null::watch:/usr/bin/mca-monitor' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	echo 'null::watch:/sbin/utermd -C /var/run/utermd_cert.pem -K /var/run/utermd_key.pem' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`stamgr`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	sed -i '\`/usr/bin/mcad`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	sed -i '\`/usr/bin/mca-monitor`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	sed -i '\`/sbin/utermd`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
