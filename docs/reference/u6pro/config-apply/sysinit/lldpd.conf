plugin_start() {
	echo 'null::respawn:/usr/sbin/lldpd -d -M4  -O /etc/lldpd.conf' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/usr/sbin/lldpd`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
		rm -f /etc/lldpd.conf
		killall lldpd
	fi
	true
}
