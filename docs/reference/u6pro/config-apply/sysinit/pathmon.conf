plugin_start() {
	echo 'null::watch:/usr/sbin/upathmond' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/usr/sbin/upathmond`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	rm -f /etc/pathmon.conf
	killall upathmond 2>/dev/null
	fi
	true
}
