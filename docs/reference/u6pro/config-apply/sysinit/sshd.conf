plugin_start() {
	echo 'null::respawn:/usr/sbin/dropbear -F -r /var/run/dropbear_rsa_host_key -r /var/run/dropbear_ed25519_host_key -p 22 -l br0' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	sed -i '\`/usr/sbin/dropbear`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	killall -9 dropbear
	true
}
