plugin_start() {
	rm -f /var/run/udhcpc.*.pid
	/sbin/ubntevent &
	[ -f /var/run/system.state -a "$(grep -ic upgrad /var/run/system.state)" != "0" ] || echo 3 > /proc/sys/kernel/panic
	echo 1 > /proc/sys/kernel/panic_on_oops
	logger "sending SIGHUP to mcad for config reload"
	pkill -SIGHUP -f mcad
	echo 60 > /proc/gpio/resetbtn_age
	echo 1 > /proc/gpio/resetbtn
	echo 0 > /var/run/system.analytics.mode
	echo 0 > /var/run/system.analytics.coredump
	echo 'null::watch:/sbin/sysmon' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	kill `pidof ubntevent`
	pkill -SIGTERM -f mcad
	true
}
