plugin_start() {
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	rm -f /var/run/peer_aps
	touch /var/run/peer_aps.lock
	rm -f /var/run/pmf_mode.*
	syswrapper.sh handle-dyn accept-mac apply -i "wifi0ap0"
	brctl delif br0.2 wifi0ap0
	cfg80211tool "wifi0ap0" vlan_id 2 1
	echo 0 > /var/run/pmf_mode.wifi0ap0
	cfg80211tool "wifi0ap0" proxyarp 0
	cfg80211tool "wifi0ap0" wnm 0
	echo true > /var/run/wifi0.reload
	syswrapper.sh handle-dyn accept-mac apply -i "wifi1ap1"
	cfg80211tool "wifi1ap1" vlan_id 1 0
	echo 1 > /var/run/pmf_mode.wifi1ap1
	cfg80211tool "wifi1ap1" proxyarp 1
	cfg80211tool "wifi1ap1" wnm 0
	echo true > /var/run/wifi1.reload
	sed -i '\`/sbin/radius-fqdn`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	killall radius-fqdn 2>/dev/null; rm -f /etc/radius-fqdn.conf
	fi
	FAST_KILL_LIST="$FAST_KILL_LIST hostapd radius-da-dispatcher"
	FAST_KILL_LIST="$FAST_KILL_LIST udhcpc"
	echo 'null::respawn:/usr/bin/hostapd_wrapper.sh' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	if [ "$IS_UBNTCONF_FAST_APPLY" != "true" ]; then
	rm -f /var/run/pmf_mode.*
	killall radius-da-dispatcher
	syswrapper.sh hostapd-deinit
	sed -i '\`/usr/bin/hostapd_wrapper.sh`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	fi
	true
}
