plugin_start() {
	fw_printenv > /tmp/fwenv
	if [ `grep -c 'is_default=false' /tmp/fwenv` -eq 1 ]; then
	id_default=false
	else
	id_default=true
	fi
	systemid=`cat /proc/ubnthal/system.info | grep systemid | cut -c 10-`
	ethaddr=`cat /proc/ubnthal/system.info | grep eth0 | cut -c 14-`
	btaddr=`cat /proc/ubnthal/system.info | grep bt | cut -c 13- | sed 's/://g'`
	if [ `cat /sys/class/remoteproc/remoteproc1/firmware` = IPQ5018/bt_fw_patch.mdt ]; then
	echo start > /sys/class/remoteproc/remoteproc1/state
	echo stop  > /sys/class/remoteproc/remoteproc1/state
	echo start > /sys/class/remoteproc/remoteproc1/state
	fi
	if [ `cat /sys/class/remoteproc/remoteproc4/firmware` = IPQ5018/bt_fw_patch.mdt ]; then
	echo start > /sys/class/remoteproc/remoteproc4/state
	echo stop  > /sys/class/remoteproc/remoteproc4/state
	echo start > /sys/class/remoteproc/remoteproc4/state
	fi
	if [ ! -f '/usr/share/unifi-anywhere/check-sys-support.sh' ] || ! /usr/share/unifi-anywhere/check-sys-support.sh /usr/share/unifi-anywhere/; then
	ubnt-btmw-rpc -d ${id_default} -s ${systemid} -e ${ethaddr} -b ${btaddr} &
	fi
	rm /tmp/fwenv
	true
}
plugin_stop() {
	killall -SIGTERM ubnt-btmw-rpc
	killall -SIGTERM btservice
	true
}
