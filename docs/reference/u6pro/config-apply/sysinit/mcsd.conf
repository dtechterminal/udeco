plugin_start() {
	rm -f /etc/mcsd*.conf
	cat > /etc/mcsd.conf << 'EOF'
[INTERFACE]
WifiDevice=wifi0ap0,wifi1ap1
SwitchDevice=eth0
SwitchDeviceId=1
SwitchLanVid=auto
SwitchCpuPort=0
NonSnoopBridge=
BlockedInterface=
EOF
echo 1 > /sys/class/net/br0.2/bridge/multicast_snooping
/usr/sbin/mcsctl -s br0.2 state enable
/usr/sbin/mcsctl -s br0.2 policy flood
/usr/sbin/mcsctl -s br0.2 aging 260
echo 1 > /sys/class/net/br0/bridge/multicast_snooping
/usr/sbin/mcsctl -s br0 state enable
/usr/sbin/mcsctl -s br0 policy flood
/usr/sbin/mcsctl -s br0 aging 260
	echo 'null::respawn:/usr/sbin/mcsd -d -C /etc/mcsd.conf' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
plugin_stop() {
	/usr/sbin/mcsctl -s br0.2 state disable
	echo 0 > /sys/class/net/br0.2/bridge/multicast_snooping
	echo 0 > /sys/class/net/br0.2/bridge/multicast_querier
	/usr/sbin/mcsctl -s br0 state disable
	echo 0 > /sys/class/net/br0/bridge/multicast_snooping
	echo 0 > /sys/class/net/br0/bridge/multicast_querier
rm -f /etc/mcsd*.conf
	sed -i '\`mcsd`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
