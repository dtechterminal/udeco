plugin_start() {
	echo 'null::watch:/sbin/autotxpow -v' >> /etc/inittab
	FAST_RESTART_INITTAB="true"
		init -q
	touch /var/run/radio_devnames
	[ -w /sys/module/qca_ol/parameters/fw_recovery ] && echo 1 > /sys/module/qca_ol/parameters/fw_recovery
	rm -f /var/run/*.bw
	cfg80211tool "wifi0" setCountryID 356
	cfg80211tool "wifi0" dl_loglevel 0xffff0006
	cfg80211tool "wifi1" setCountryID 356
	cfg80211tool "wifi1" dl_loglevel 0xffff0006
	echo 20 > /var/run/wifi0.bw
	echo true > /var/run/wifi0.init
	grep -Fxq "wifi0" /var/run/radio_devnames || echo "wifi0" >> "/var/run/radio_devnames"
	echo 1 > /var/run/wifi0.band
	cfg80211tool "wifi0" ui_pref_ch 5
	cfg80211tool "wifi0" setCH144 3
	wlanconfig "wifi0ap0"  create wlandev wifi0 wlanmode ap  -cfg80211
	grep -Fxq "wifi0ap0" /var/run/wifi0_devnames || echo "wifi0ap0" >> "/var/run/wifi0_devnames"
	grep -Fxq "wifi0ap0" /var/run/wlan_configured_devnames || echo "wifi0ap0" >> "/var/run/wlan_configured_devnames"
	PHYNAME="$(cat /sys/class/net/wifi0/phy80211/name)"
	iw phy $PHYNAME interface add wifi0ap0 type __ap
	cfg80211tool "wifi0" acs_2g_allch 0
	wifitool "wifi0ap0" block_acs_channel 0
	wifitool "wifi0ap0" block_acs_channel -band 1 2,3,4,5,7,8,9,10,12,13,14
	cfg80211tool wifi0ap0 ant_ps_on 0
	echo 1 > /sys/devices/virtual/net/wifi0ap0/queues/rx-0/rps_cpus
	cfg80211tool "wifi0" ant_gain 4
	cfg80211tool "wifi0" txchainmask 3
	cfg80211tool "wifi0" rxchainmask 3
	cfg80211tool "wifi0" dcs_enable 0
	cfg80211tool "wifi0" dcs_afc_random_chan_en 1
	cfg80211tool "wifi0" dbdc_enable 0
	cfg80211tool "wifi0" txbf_snd_int 100
	cfg80211tool "wifi0" sIgmpDscpOvrid 1
	cfg80211tool "wifi0" sIgmpDscpTidMap 6
	cfg80211tool "wifi0" obss_rssi_th 30
	cfg80211tool "wifi0" obss_rxrssi_th 30
	cfg80211tool "wifi0" acs_nf_thresh -80
	[ -w /sys/module/qca_ol/parameters/fw_recovery ] || cfg80211tool wifi0 set_fw_recovery 1
	cfg80211tool "wifi0" dl_loglevel 0xffff0006
	cfg80211tool "wifi0ap0" mode 11GHE20
	echo 11GHE20 > /var/run/wifi0.mode
	echo 1 > /var/run/wifi0.eu
	cfg80211tool "wifi0ap0" outdoor 0
	echo 0 > /var/run/wifi0.outdoor
	cfg80211tool "wifi0" enable_ol_stats 1
	echo 13 > /var/run/wifi0.ch
	cfg80211tool "wifi0" ant_gain 4
	echo "iwconfig wifi0ap0 txpower 14" >> /var/run/if_up_hook.wifi0ap0
	cfg80211tool "wifi0" set_bcnburst 1
	cfg80211tool "wifi0ap0" shortgi 1
	cfg80211tool "wifi0ap0" puren 0
	cfg80211tool "wifi0" ani_enable 0
	ifconfig "wifi0" up
	echo 160 > /var/run/wifi1.bw
	echo true > /var/run/wifi1.init
	grep -Fxq "wifi1" /var/run/radio_devnames || echo "wifi1" >> "/var/run/radio_devnames"
	echo 2 > /var/run/wifi1.band
	cfg80211tool "wifi1" ui_pref_ch 5
	cfg80211tool "wifi1" setCH144 3
	wlanconfig "wifi1ap1"  create wlandev wifi1 wlanmode ap  -cfg80211
	grep -Fxq "wifi1ap1" /var/run/wifi1_devnames || echo "wifi1ap1" >> "/var/run/wifi1_devnames"
	grep -Fxq "wifi1ap1" /var/run/wlan_configured_devnames || echo "wifi1ap1" >> "/var/run/wlan_configured_devnames"
	PHYNAME="$(cat /sys/class/net/wifi1/phy80211/name)"
	iw phy $PHYNAME interface add wifi1ap1 type __ap
	cfg80211tool "wifi1ap1" no_wradar 0
	wifitool "wifi1ap1" block_acs_channel 0
	wifitool "wifi1ap1" block_acs_channel -band 2 149,153,157,161,165
	cfg80211tool wifi1ap1 ant_ps_on 0
	echo 2 > /sys/devices/virtual/net/wifi1ap1/queues/rx-0/rps_cpus
	cfg80211tool "wifi1" ant_gain 6
	cfg80211tool "wifi1" txchainmask 15
	cfg80211tool "wifi1" rxchainmask 15
	cfg80211tool "wifi1" dcs_enable 0
	cfg80211tool "wifi1" dcs_afc_random_chan_en 1
	cfg80211tool "wifi1" dbdc_enable 0
	cfg80211tool "wifi1" txbf_snd_int 100
	cfg80211tool "wifi1" sIgmpDscpOvrid 1
	cfg80211tool "wifi1" sIgmpDscpTidMap 6
	cfg80211tool "wifi1" obss_rssi_th 30
	cfg80211tool "wifi1" obss_rxrssi_th 30
	cfg80211tool "wifi1" acs_nf_thresh -80
	[ -w /sys/module/qca_ol/parameters/fw_recovery ] || cfg80211tool wifi1 set_fw_recovery 1
	cfg80211tool "wifi1" dl_loglevel 0xffff0006
	cfg80211tool "wifi1ap1" mode 11AHE160
	echo 11AHE160 > /var/run/wifi1.mode
	echo 1 > /var/run/wifi1.eu
	cfg80211tool "wifi1ap1" outdoor 0
	echo 0 > /var/run/wifi1.outdoor
	cfg80211tool "wifi1" enable_ol_stats 1
	[ -e /var/run/enable-precac ] && cfg80211tool wifi1 preCACEn 1 || cfg80211tool wifi1 preCACEn 0
	echo 40 > /var/run/wifi1.ch
	cfg80211tool "wifi1" ant_gain 6
	echo "iwconfig wifi1ap1 txpower 24" >> /var/run/if_up_hook.wifi1ap1
	cfg80211tool "wifi1" set_bcnburst 1
	cfg80211tool "wifi1ap1" shortgi 1
	cfg80211tool "wifi1ap1" puren 0
	cfg80211tool "wifi1" ani_enable 0
	cfg80211tool "wifi1" presp_ret_lim 3
	ifconfig "wifi1" up
	echo Y > /sys/module/ipq_cnss2/parameters/ramdump_enabled
	true
}
plugin_stop() {
	wlanconfig "wifi0ap0"  destroy
	rm /var/run/wifi0_devnames
	rm /var/run/wifi0.mode
	rm /var/run/wifi0.ch
	rm /var/run/wifi0.bw
	rm /var/run/wifi0.band
	rm /var/run/wifi0.minrssi
	rm /var/run/wifi0.eu
	rm /var/run/wifi0.outdoor
	rm /var/run/wifi0.curchan
	rm /var/run/wifi0.ssids
	wlanconfig "wifi1ap1"  destroy
	rm /var/run/wifi1_devnames
	rm /var/run/wifi1.mode
	rm /var/run/wifi1.ch
	rm /var/run/wifi1.bw
	rm /var/run/wifi1.band
	rm /var/run/wifi1.minrssi
	rm /var/run/wifi1.eu
	rm /var/run/wifi1.outdoor
	rm /var/run/wifi1.curchan
	rm /var/run/wifi1.ssids
	[ -e /var/run/scan_devname ] && iw `cat /var/run/scan_devname` del
	rm -f /var/run/scan_devname
	rm -f /var/run/radio_devnames
	sed -i '\`/sbin/autotxpow -v`d' /etc/inittab
	FAST_RESTART_INITTAB="true"
	true
}
